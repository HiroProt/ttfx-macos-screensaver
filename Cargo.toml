[package]
name = "ttfx-ffi"
version = "0.1.0"
edition = "2021"
description = "C API over the ttfx terminal-effects engine, for the macOS screensaver"
license = "MIT"
publish = false

[lib]
# The screensaver links this straight into its bundle executable, so the
# engine travels with the .saver — no subprocess, which the sandboxed
# screensaver host would make unreliable anyway.
crate-type = ["staticlib"]

[dependencies]
# Upstream, unmodified and pinned. Everything this shim needs is already
# public API, so there is no fork to keep in sync.
# Pinned by commit rather than tag: this is upstream's v0.1.2, but a tag can
# be moved and a commit cannot, so `cargo update` can never silently follow a
# retagged v0.1.2. Cargo permits only one of tag/rev, hence the comment.
ttfx = { git = "https://github.com/omacom-io/ttfx", rev = "01d48abe7aea10022848f14915ac3aac3bf7c920" }
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = true
codegen-units = 1
